[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igs-backend"
version = "1.0.0"
description = "Intelligent General Service - Backend API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    # Database
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    # Redis / Celery
    "redis==5.1.1",
    "celery[redis]==5.4.0",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.3",
    # Validation
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "email-validator==2.2.0",
    # HTTP client
    "httpx==0.27.2",
    # AI
    "anthropic==0.40.0",
    "google-generativeai>=0.8.0",
    "groq>=0.9.0",
    # Encryption
    "cryptography==43.0.1",
    # Monitoring
    "prometheus-fastapi-instrumentator==7.0.0",
    # Reports
    "reportlab==4.2.5",
    "openpyxl==3.1.5",
    # Slides export
    "python-pptx==1.0.2",
    # Resilience
    "tenacity==9.0.0",
    # Utilities
    "python-dateutil==2.9.0",
    "pytz==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.7.0",
    "factory-boy==3.3.1",
    "aiosqlite==0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N818"]
