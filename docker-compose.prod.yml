##############################################################################
# PRODUCTION docker-compose — Security-hardened
#
# PostgreSQL: ZERO published ports, SCRAM-SHA-256, custom pg_hba.conf
# Redis: ZERO published ports, password-protected, dangerous commands disabled
# Tailscale: encrypted mesh VPN for remote admin access
# Nginx: ONLY public-facing service (80/443)
# Monitoring: internal-only, accessible via Tailscale
#
# Usage: docker compose -f docker-compose.prod.yml up -d
##############################################################################

services:
  # ── Tailscale Sidecar (encrypted mesh VPN) ────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: igs_tailscale
    restart: always
    hostname: igs-prod
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-tags=tag:igs-server
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    networks:
      - igs_internal

  # ── API Backend ──────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igs_api
    restart: always
    env_file: .env.prod
    environment:
      # App connects as igs_app role → subject to RLS
      - DATABASE_URL=postgresql+asyncpg://igs_app:${RLS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - APP_ENV=production
      - APP_DEBUG=false
      - RLS_ENABLED=true
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - igs_internal
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ── Celery Worker ─────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igs_celery_worker
    restart: always
    env_file: .env.prod
    environment:
      # Worker connects as igs_worker role → BYPASSRLS for cross-tenant batch tasks
      - DATABASE_URL=postgresql+asyncpg://igs_worker:${RLS_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - APP_ENV=production
      - RLS_ENABLED=true
    depends_on:
      - postgres
      - redis
    networks:
      - igs_internal
    command: celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=8
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── Celery Beat ───────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igs_celery_beat
    restart: always
    env_file: .env.prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://igs_worker:${RLS_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - APP_ENV=production
      - RLS_ENABLED=true
    depends_on:
      - postgres
      - redis
    networks:
      - igs_internal
    command: celery -A app.tasks.celery_app beat --loglevel=warning

  # ── PostgreSQL (ZERO public ports) ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: igs_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/pg_hba.conf:/docker-entrypoint-initdb.d/pg_hba.conf:ro
      - ./infra/postgresql.conf:/docker-entrypoint-initdb.d/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - igs_internal
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Redis (ZERO public ports, password-protected) ─────────
  redis:
    image: redis:7-alpine
    container_name: igs_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --rename-command FLUSHDB ""
        --rename-command FLUSHALL ""
        --rename-command DEBUG ""
        --rename-command CONFIG "IGS_REDIS_CONFIG_8f3a"
        --save 60 1000
        --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - igs_internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx (ONLY public-facing service) ────────────────────
  nginx:
    image: nginx:alpine
    container_name: igs_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - igs_internal
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Certbot ───────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: igs_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - igs_internal

  # ── Monitoring (ALL internal, ZERO public ports) ──────────
  prometheus:
    image: prom/prometheus:latest
    container_name: igs_prometheus
    restart: always
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - igs_internal

  grafana:
    image: grafana/grafana:latest
    container_name: igs_grafana
    restart: always
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - igs_internal

  loki:
    image: grafana/loki:latest
    container_name: igs_loki
    restart: always
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - igs_internal

  promtail:
    image: grafana/promtail:latest
    container_name: igs_promtail
    restart: always
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - igs_internal

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: igs_redis_exporter
    restart: always
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - igs_internal

  alertmanager:
    image: prom/alertmanager:latest
    container_name: igs_alertmanager
    restart: always
    expose:
      - "9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    networks:
      - igs_internal

networks:
  igs_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tailscale_state:
