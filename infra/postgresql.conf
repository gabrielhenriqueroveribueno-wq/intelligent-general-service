# PostgreSQL 16 — Hardened production config for IGS
# Loaded via: -c config_file=/etc/postgresql/postgresql.conf

# ── Connection ───────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 100

# ── Authentication ───────────────────────────────────────────
password_encryption = scram-sha-256

# ── SSL (enable if certs are mounted) ────────────────────────
# ssl = on
# ssl_cert_file = '/etc/postgresql/server.crt'
# ssl_key_file = '/etc/postgresql/server.key'
# ssl_min_protocol_version = 'TLSv1.3'

# ── Logging ──────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Log all DDL and slow queries
log_statement = 'ddl'
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p] %u@%d '

# ── Memory ───────────────────────────────────────────────────
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# ── WAL ──────────────────────────────────────────────────────
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# ── Row-Level Security audit ─────────────────────────────────
# Log when RLS policies are bypassed (requires pg >= 15)
# Useful for auditing igs_worker BYPASSRLS access
row_security = on
