# PostgreSQL Host-Based Authentication (pg_hba.conf)
# Hardened for IGS production
#
# TYPE  DATABASE  USER         ADDRESS       METHOD
#
# Superuser — local socket only (for migrations, emergencies)
local   all       igs_user                   scram-sha-256
# App role — only from Docker internal network
host    igs_db    igs_app      172.16.0.0/12 scram-sha-256
host    igs_db    igs_app      10.0.0.0/8    scram-sha-256
# Worker role — only from Docker internal network
host    igs_db    igs_worker   172.16.0.0/12 scram-sha-256
host    igs_db    igs_worker   10.0.0.0/8    scram-sha-256
# Superuser — Docker network only (for Alembic migrations)
host    igs_db    igs_user     172.16.0.0/12 scram-sha-256
host    igs_db    igs_user     10.0.0.0/8    scram-sha-256
# Deny everything else
host    all       all          0.0.0.0/0     reject
